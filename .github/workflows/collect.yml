name: collect
on:
  schedule:
    - cron: "7 * * * *"   # hourly, at :07
  workflow_dispatch:
concurrency:
  group: nem-db          # shared with forecast.yml: never two writers on the file
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NEM_DB: nem.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: scripts/release_db.sh download nem.duckdb
      - run: uv run python -m ingest.cli counts --db nem.duckdb > old.json
      - run: uv run python -m ingest.cli collect --db nem.duckdb
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt --vars '{forecasts_ready: true}'
      - run: uv run python -m ingest.cli counts --db nem.duckdb > new.json
      - run: uv run python -m ingest.cli guard --old old.json --new new.json
      - run: scripts/release_db.sh upload nem.duckdb
      - run: ls -l nem.duckdb   # budget: keep under 500 MB
