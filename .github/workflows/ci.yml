name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/build_sample_db.py data/ci.duckdb
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt
        env:
          NEM_DB: data/ci.duckdb
      - name: Dashboard works with only the hosted requirements
        run: >-
          uv run --isolated --no-project --python 3.12 --with-requirements requirements.txt
          python scripts/check_dashboard.py data/ci.duckdb
