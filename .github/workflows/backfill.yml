name: backfill
# One-off (manual) history load: 13 months of dispatch, rooftop PV and fuel mix (Spark),
# 3 months of AEMO pre-dispatch forecasts, weather history, then the 3-month backtest.
on:
  workflow_dispatch:
    inputs:
      history_months:
        description: "Months of dispatch / rooftop / fuel-mix history"
        default: "13"
      backtest_months:
        description: "Months of AEMO forecasts + backtest"
        default: "3"
concurrency:
  group: nem-db
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      NEM_DB: nem.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync
      - name: Dates
        run: |
          echo "SINCE=$(date -d "-${{ inputs.history_months }} months" +%F)" >> "$GITHUB_ENV"
          echo "BT_SINCE=$(date -d "-${{ inputs.backtest_months }} months -14 days" +%F)" >> "$GITHUB_ENV"
          echo "YESTERDAY=$(date -d yesterday +%F)" >> "$GITHUB_ENV"
      - run: scripts/release_db.sh download nem.duckdb
      - run: uv run python -m ingest.cli counts --db nem.duckdb > old.json
      - run: uv run python -m ingest.cli backfill-nemweb --db nem.duckdb --source dispatch --since "$SINCE"
      - run: uv run python -m ingest.cli backfill-nemweb --db nem.duckdb --source rooftop_pv --since "$SINCE"
      - run: uv run python -m ingest.cli backfill-nemweb --db nem.duckdb --source predispatch --since "$BT_SINCE"
      - name: Fuel mix with Spark
        run: |
          uv run python scripts/download_archive.py scada data/archive/scada --since "$SINCE"
          curl -sSL -A "nem-energy-pipeline/0.1 (student portfolio project)" -o data/registration.xlsx \
            "https://www.aemo.com.au/-/media/files/electricity/nem/participant_information/nem-registration-and-exemption-list.xlsx"
          uv run python -m spark.backfill --scada-dir data/archive/scada --registration data/registration.xlsx --out data/fuel_mix.parquet
          uv run python -m ingest.cli load-parquet --db nem.duckdb --table raw.fuel_mix --path data/fuel_mix.parquet
          rm -rf data/archive
      - run: uv run python -m ingest.cli weather-history --db nem.duckdb --start "$SINCE" --end "$YESTERDAY" --kind archive
      - run: uv run python -m ingest.cli weather-history --db nem.duckdb --start "$BT_SINCE" --end "$YESTERDAY" --kind historical_forecast
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt
      - run: uv run python -m forecast.cli backtest --db nem.duckdb --months ${{ inputs.backtest_months }} | tee backtest.txt
      - run: >-
          uv run dbt build --project-dir dbt --profiles-dir dbt
          --vars '{"forecasts_ready": true}'
      - run: uv run python -m ingest.cli counts --db nem.duckdb > new.json
      - run: uv run python -m ingest.cli guard --old old.json --new new.json
      - run: scripts/release_db.sh upload nem.duckdb
      - run: ls -l nem.duckdb && cat backtest.txt
